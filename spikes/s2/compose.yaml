services:
  pg:
    image: postgres:16-alpine
    container_name: s2-pg
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=off   # spike measures ingest throughput, not durability trade-off
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
    mem_limit: 1500m
    ports:
      - "5433:5432"
