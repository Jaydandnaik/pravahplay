<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="PravahPlay wordmark concept">
  <!-- Original concept geometry: three ascending flow waves forming a play chevron. -->
  <rect width="960" height="240" fill="#14162B"/>
  <g transform="translate(48,48)">
    <!-- tile -->
    <rect x="0" y="0" width="144" height="144" rx="32" fill="#1E2140" stroke="#2EC4B6" stroke-width="2"/>
    <!-- flow waves, ascending; the third doubles as a play-chevron -->
    <path d="M28 96 Q52 68 76 96 T124 96" fill="none" stroke="#2EC4B6" stroke-width="9" stroke-linecap="round"/>
    <path d="M28 72 Q52 44 76 72 T124 72" fill="none" stroke="#F6F7FB" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M28 48 Q52 20 76 48 T124 48" fill="none" stroke="#FF9F1C" stroke-width="9" stroke-linecap="round"/>
    <!-- play chevron -->
    <path d="M60 66 L96 88 L60 110 Z" fill="#FF9F1C"/>
  </g>
  <text x="232" y="150" font-family="Sora, Inter, sans-serif" font-size="72" font-weight="700"
        letter-spacing="4" fill="#F6F7FB">PRAVAH<tspan fill="#FF9F1C">PLAY</tspan></text>
  <text x="236" y="190" font-family="Inter, sans-serif" font-size="20" letter-spacing="8"
        fill="#8A90B8">EVERY SCREEN, ONE FLOW</text>
</svg>
